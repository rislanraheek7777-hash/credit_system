name: credential_recovery_backend
description: "Standalone, least-privilege credential recovery authority for the Credit Management System."
publish_to: none

environment:
  sdk: ^3.13.4

dependencies:
  shelf: ^1.4.2
  postgres: ^3.5.0
  crypto: ^3.0.6
  http: ^1.6.0
  # The backend rotates the Argon2id PHC hash that the Flutter client verifies
  # on its next login. The hash must be created here, never in the client.
  argon2: ^1.0.1

dev_dependencies:
  test: ^1.25.0
