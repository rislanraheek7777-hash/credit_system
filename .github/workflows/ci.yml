name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - run: flutter pub get

      - name: Resolve standalone backend dependencies
        working-directory: backend
        run: dart pub get

      - name: Static analysis (client)
        run: flutter analyze lib/ test/

      - name: Static analysis (recovery backend)
        working-directory: backend
        run: dart analyze

      - name: Recovery backend API contract tests
        working-directory: backend
        run: dart test

      - name: Release recovery gateway wiring
        env:
          CS_RECOVERY_SERVER_URL: https://recovery.example.internal/
        run: |
          test -n "$CS_RECOVERY_SERVER_URL"
          flutter test \
            --dart-define=CS_RECOVERY_SERVER_URL="$CS_RECOVERY_SERVER_URL" \
            test/unit/features/auth/gateway_wiring_test.dart

      - name: Custom lint - no monetary double
        run: |
          if grep -R "double" lib/domain/ lib/data/ --include="*.dart" | grep -i "money\|amount\|price\|balance"; then
            echo "Monetary double usage detected"; exit 1;
          fi

      - name: Unit and widget tests
        run: flutter test test/unit/ test/widget/

      - name: DB integration & boundary tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          flutter test integration_test/ || true

      - name: pgTAP tenant-isolation and recovery migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash test/integration/tenant_isolation/run_pgtap_tests.sh
